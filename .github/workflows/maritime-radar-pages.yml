name: Deploy Maritime Chartering Radar to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Maritime_Chartering_Radar/**'
      - '.github/workflows/maritime-radar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maritime-radar-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Radar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./Maritime_Chartering_Radar
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
